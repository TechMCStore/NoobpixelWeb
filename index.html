
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BCTECHNOOP YT | Gaming Hub</title>

<style>
:root {
  --bg: #0b1018;
  --panel: #141d2a;
  --text: #f4f7fb;
  --muted: #a8b4c5;
  --green: #66f0a6;
  --blue: #66c7ff;
  --line: #29374a;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: radial-gradient(ellipse at top, #172638, var(--bg) 70%);
  color: var(--text);
  font-family: Arial, sans-serif;
  line-height: 1.6;
}

.wrap {
  width: 92%;
  max-width: 1100px;
  margin: auto;
}

header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: #0b1018;
  border-bottom: 1px solid var(--line);
}

.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 0;
}

.brand {
  font-size: 17px;
  font-weight: 900;
  color: var(--green);
}

button, .btn, .social a {
  cursor: pointer;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 13px;
  background: var(--panel);
  color: var(--text);
  text-decoration: none;
}

button:hover, .btn:hover, .social a:hover {
  border-color: var(--green);
}

.navlinks {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
}

.menuWrap { position: relative; }

.menuBtn {
  font-size: 24px;
  width: 44px;
}

.dropdown {
  display: none;
  position: absolute;
  right: 0;
  top: 50px;
  width: 210px;
  padding: 8px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
}

.dropdown.open {
  display: grid;
  gap: 6px;
}

.dropdown a {
  color: var(--text);
  text-decoration: none;
  padding: 9px;
  border-radius: 8px;
}

.dropdown a:hover {
  background: #243548;
  color: var(--green);
}

.page {
  display: none;
  padding: 30px 0 45px;
}

.page.active { display: block; }

h1 {
  font-size: clamp(38px, 7vw, 65px);
  line-height: 1.1;
}

h2 { font-size: 35px; }

.gradient {
  background: linear-gradient(90deg, var(--green), var(--blue));
  color: transparent;
  background-clip: text;
}

.muted { color: var(--muted); }

.hero {
  display: grid;
  grid-template-columns: 1.2fr .8fr;
  gap: 20px;
  align-items: center;
  padding: 25px 0;
}

.heroArt {
  text-align: center;
  padding: 40px 10px;
  font-size: 70px;
  background: #152638;
  border: 1px solid var(--line);
  border-radius: 20px;
}

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 17px;
  padding: 20px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  margin: 20px 0;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: 18px 0;
}

.primary {
  background: var(--green);
  color: #06110b;
  font-weight: bold;
}

.social {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-top: 20px;
}

.social a { padding: 16px; }

.quizQ {
  font-size: 21px;
  font-weight: bold;
}

.answers {
  display: grid;
  gap: 10px;
}

.answers button { text-align: left; }

.feedback {
  color: var(--green);
  margin: 12px 0;
}

.gameBox {
  text-align: center;
  padding: 25px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: #101722;
}

.target {
  display: none;
  margin: 20px auto;
  width: 100px;
  height: 100px;
  border-radius: 50%;
  background: var(--green);
  color: #071018;
  font-weight: bold;
  font-size: 22px;
}

.target.ready { display: block; }

.faq details {
  background: var(--panel);
  padding: 15px;
  margin: 10px 0;
  border-radius: 10px;
}

.faq summary { cursor: pointer; font-weight: bold; }

footer {
  border-top: 1px solid var(--line);
  padding: 20px 0;
  color: var(--muted);
}

@media (max-width: 700px) {
  .nav { flex-wrap: wrap; }
  .navlinks {
    order: 3;
    width: 100%;
    overflow-x: auto;
    flex-wrap: nowrap;
  }
  .navlinks button { white-space: nowrap; }
  .hero, .grid, .social { grid-template-columns: 1fr; }
}
</style>
</head>

</header>
