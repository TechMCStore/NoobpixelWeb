<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NoobPixel | Social Hub</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #171717;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 30px 12px;
}

h1 {
  color: #55ff55;
  text-shadow: 3px 3px #174b17;
}

p {
  color: #cccccc;
}

.buttons {
  margin: 25px auto;
  display: flex;
  justify-content: center;
  gap: 15px;
  flex-wrap: wrap;
}

button {
  cursor: pointer;
  border: 3px solid #333;
  padding: 12px 20px;
  font-weight: bold;
  font-size: 16px;
  background: #777;
  color: white;
  box-shadow: inset -4px -4px #444,
              inset 4px 4px #aaa;
}

button:hover {
  filter: brightness(1.2);
}

.chest {
  display: none;
  width: min(100%, 430px);
  margin: 25px auto;
  padding: 15px;
  background: #c6a16b;
  border: 5px solid #604020;
  box-shadow: inset 0 0 0 3px #e7c995;
}

.chest h2 {
  color: #3b2413;
  font-size: 20px;
}

.slots {
  display: grid;
  grid-template-columns: repeat(9, minmax(0, 1fr));
  gap: 4px;
}

.slot {
  aspect-ratio: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #8b8b8b;
  border: 3px solid;
  border-color: #555 #ddd #ddd #555;
  cursor: pointer;
}

.slot:hover {
  background: #b5b5b5;
  outline: 2px solid white;
}

.slot img {
  width: 85%;
  height: 85%;
  object-fit: contain;
  image-rendering: pixelated;
}

.close {
  margin-top: 15px;
}

footer {
  margin-top: 40px;
  color: #888;
}
</style>
</head>

<body>

<h1>⚔ NOOBPIXEL ⚔</h1>
<p>Choose your social media!</p>

<div class="buttons">
  <button onclick="openChest('youtube')">
    ▶ YouTube
  </button>

  <button onclick="openChest('instagram')">
    📸 Instagram
  </button>
</div>

<div id="youtube" class="chest">
  <h2>▶ YouTube Chest</h2>
  <div id="youtubeSlots" class="slots"></div>
  <button class="close" onclick="closeChests()">Close</button>
</div>

<div id="instagram" class="chest">
  <h2>📸 Instagram Chest</h2>
  <div id="instagramSlots" class="slots"></div>
  <button class="close" onclick="closeChests()">Close</button>
</div>

<footer>
  Made with ❤️ by NoobPixel
</footer>

<script>
const youtubeURL =
  "https://youtube.com/@noobpixelofficial";

// Apna Instagram profile link yahan daalna:
const instagramURL =
  "https://www.instagram.com/YOUR_USERNAME/";

function makeSlots(containerId, imageURL, action) {
  const container = document.getElementById(containerId);

  for (let i = 0; i < 27; i++) {
    const slot = document.createElement("div");
    slot.className = "slot";

    // 14th slot = center of 3x9 inventory
    if (i === 13) {
      const img = document.createElement("img");
      img.src = imageURL;
      img.alt = action + " logo";
      slot.appendChild(img);

      slot.title = "Click to open " + action;

      slot.onclick = function() {
        window.open(
          action === "YouTube" ? youtubeURL : instagramURL,
          "_blank",
          "noopener,noreferrer"
        );
      };
    }

    container.appendChild(slot);
  }
}

function openChest(id) {
  closeChests();
  document.getElementById(id).style.display = "block";
  document.getElementById(id).scrollIntoView({
    behavior: "smooth",
    block: "center"
  });
}

function closeChests() {
  document.getElementById("youtube").style.display = "none";
  document.getElementById("instagram").style.display = "none";
}

makeSlots(
  "youtubeSlots",
  "https://cdn.simpleicons.org/youtube/FF0000",
  "YouTube"
);

makeSlots(
  "instagramSlots",
  "https://cdn.simpleicons.org/instagram/E4405F",
  "Instagram"
);
</script>

</body>
</html>
